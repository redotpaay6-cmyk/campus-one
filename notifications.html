
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>CAMPUS ONE | الإشعارات</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172b46;
}
header{
  background:#102b50;
  color:white;
  padding:18px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 12px #0002;
}
.logo{font-size:20px;font-weight:bold}
.header-label{font-size:13px;color:#dbeafe}
.container{
  max-width:760px;
  margin:25px auto;
  padding:0 14px;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}
h2{margin:0;font-size:22px}
button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:11px;
  display:flex;
  gap:12px;
  align-items:center;
  border:1px solid #e6ebf2;
  cursor:pointer;
  transition:.2s;
}
.card:hover{border-color:#93b4ed}
.card.unread{
  background:#eff6ff;
  border-color:#bfdbfe;
}
.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  object-fit:cover;
  background:#dbeafe;
}
.initial{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1d4ed8;
  font-size:20px;
  font-weight:bold;
}
.info{flex:1;min-width:0}
.name{font-weight:bold;font-size:15px}
.message{font-size:14px;color:#475569;margin-top:5px}
.time{font-size:12px;color:#94a3b8;margin-top:7px}
.dot{
  width:9px;height:9px;
  min-width:9px;
  border-radius:50%;
  background:#2563eb;
}
.empty,.status{
  background:white;
  padding:35px 15px;
  text-align:center;
  border-radius:14px;
  color:#64748b;
}
.empty-icon{font-size:35px;margin-bottom:12px}
.nav{
  display:flex;
  justify-content:space-around;
  position:fixed;
  bottom:0;left:0;right:0;
  background:white;
  border-top:1px solid #e2e8f0;
  padding:12px 4px;
  z-index:5;
}
.nav a{
  color:#64748b;
  text-decoration:none;
  font-size:12px;
  text-align:center;
}
.nav a.active{color:#2563eb;font-weight:bold}
main{padding-bottom:80px}
@media(max-width:480px){
  .container{margin-top:18px}
  h2{font-size:20px}
  .card{padding:12px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🎓 CAMPUS ONE</div>
  <div class="header-label">مساحتك الجامعية</div>
</header>

<main>
<div class="container">

  <div class="top">
    <h2>🔔 الإشعارات</h2>
    <button id="readAllBtn" onclick="markAllRead()">
      تحديد الكل كمقروء
    </button>
  </div>

  <div id="status" class="status">جارٍ تحميل الإشعارات...</div>
  <div id="notifications"></div>

</div>
</main>

<nav class="nav">
  <a href="dashboard.html">🏠<br>الرئيسية</a>
  <a href="community.html">👥<br>المجتمع</a>
  <a href="notifications.html" class="active">🔔<br>الإشعارات</a>
  <a href="student.html">👤<br>حسابي</a>
</nav>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://rpvoajlzkoynimfowzgl.supabase.co';

const SUPABASE_KEY =
'sb_publishable_4KCDnpiH2lCjKhKj4s8dmA_Wv71o552';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const statusBox = document.getElementById('status');
const list = document.getElementById('notifications');
const readAllBtn = document.getElementById('readAllBtn');

let currentUser = null;
let notificationRows = [];

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  })[char]);
}

function messageFor(type){
  const messages = {
    follow:'بدأ بمتابعتك',
    like:'أعجب بمنشورك ❤️',
    comment:'علّق على منشورك 💬'
  };
  return messages[type] || 'قام بتفاعل جديد معك';
}

function formatDate(value){
  const date = new Date(value);
  return date.toLocaleString('ar-DZ',{
    dateStyle:'medium',
    timeStyle:'short'
  });
}

async function loadNotifications(){

  statusBox.textContent = 'جارٍ تحميل الإشعارات...';
  list.innerHTML = '';

  const {data:authData,error:authError} =
    await supabase.auth.getUser();

  if(authError || !authData.user){
    statusBox.textContent = 'يجب تسجيل الدخول أولاً.';
    return;
  }

  currentUser = authData.user;

  const {data:notifications,error} = await supabase
    .from('notifications')
    .select('id,actor_id,type,post_id,comment_id,is_read,created_at')
    .order('created_at',{ascending:false})
    .limit(100);

  if(error){
    statusBox.textContent =
      'تعذر تحميل الإشعارات: ' + error.message;
    return;
  }

  notificationRows = notifications || [];

  if(notificationRows.length === 0){
    statusBox.innerHTML =
      '<div class="empty"><div class="empty-icon">🔔</div>لا توجد إشعارات حتى الآن.</div>';
    readAllBtn.disabled = true;
    return;
  }

  readAllBtn.disabled =
    !notificationRows.some(item => !item.is_read);

  const actorIds = [
    ...new Set(notificationRows
      .map(item => item.actor_id)
      .filter(Boolean))
  ];

  let profiles = [];

  if(actorIds.length){
    const {data:profileData,error:profileError} =
      await supabase.rpc('get_public_profiles');

    if(!profileError){
      profiles = (profileData || []).filter(
        profile => actorIds.includes(profile.id)
      );
    }
  }

  const profileMap = {};
  profiles.forEach(profile => {
    profileMap[profile.id] = profile;
  });

  const avatarCache = {};

  for(const profile of profiles){
    if(profile.profile_avatar_path){
      const {data} = await supabase
        .storage
        .from('community-media')
        .createSignedUrl(
          profile.profile_avatar_path,
          3600
        );

      if(data?.signedUrl){
        avatarCache[profile.id] = data.signedUrl;
      }
    }
  }

  for(const item of notificationRows){

    const profile = profileMap[item.actor_id] || {};
    const name = profile.full_name || 'مستخدم CAMPUS ONE';
    const initial = escapeHTML(name.charAt(0) || '؟');
    const avatar = avatarCache[item.actor_id];

    const card = document.createElement('div');
    card.className =
      'card ' + (!item.is_read ? 'unread' : '');

    const avatarElement = document.createElement('div');
    avatarElement.className = 'avatar initial';

    if(avatar){
      const img = document.createElement('img');
      img.className = 'avatar';
      img.alt = 'الصورة الشخصية';
      img.src = avatar;
      avatarElement.replaceWith(img);
      card.appendChild(img);
    }else{
      avatarElement.textContent = initial;
      card.appendChild(avatarElement);
    }

    const info = document.createElement('div');
    info.className = 'info';

    const nameElement = document.createElement('div');
    nameElement.className = 'name';
    nameElement.textContent = name;

    const messageElement = document.createElement('div');
    messageElement.className = 'message';
    messageElement.textContent = messageFor(item.type);

    const timeElement = document.createElement('div');
    timeElement.className = 'time';
    timeElement.textContent = formatDate(item.created_at);

    info.append(nameElement,messageElement,timeElement);
    card.appendChild(info);

    if(!item.is_read){
      const dot = document.createElement('span');
      dot.className = 'dot';
      card.appendChild(dot);
    }

    card.addEventListener('click',()=>openNotification(item));
    list.appendChild(card);
  }

  statusBox.textContent = '';
}

async function markNotificationRead(id){
  const {error} = await supabase
    .from('notifications')
    .update({is_read:true})
    .eq('id',id);

  if(error) throw error;
}

async function openNotification(item){
  try{
    if(!item.is_read){
      await markNotificationRead(item.id);
    }

    if(item.post_id){
      location.href =
        'community.html#post-' + encodeURIComponent(item.post_id);
    }else if(item.actor_id){
      location.href =
        'community.html#profile-' + encodeURIComponent(item.actor_id);
    }
  }catch(error){
    alert('تعذر تحديث الإشعار: ' + error.message);
  }
}

window.markAllRead = async function(){

  if(!currentUser) return;

  readAllBtn.disabled = true;
  readAllBtn.textContent = 'جارٍ التحديث...';

  const unreadIds = notificationRows
    .filter(item => !item.is_read)
    .map(item => item.id);

  if(unreadIds.length){
    const {error} = await supabase
      .from('notifications')
      .update({is_read:true})
      .in('id',unreadIds);

    if(error){
      alert('تعذر تحديث الإشعارات: ' + error.message);
    }
  }

  readAllBtn.textContent = 'تحديد الكل كمقروء';
  await loadNotifications();
};

loadNotifications();
</script>

</body>
</html>
