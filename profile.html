
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMPUS ONE | الملف الشخصي</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#102b50;
}
header{
  background:#102b50;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:20px;font-weight:bold}
main{
  max-width:600px;
  margin:35px auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 5px 25px #102b5010;
}
.avatar{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #e2e8f0;
  background:#e2e8f0;
}
.name-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:18px;
}
h2{margin:0;font-size:24px}
.verified{
  width:23px;
  height:23px;
  background:#2563eb;
  color:white;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:bold;
}
.bio{
  color:#64748b;
  line-height:1.9;
  margin:15px auto;
  white-space:pre-wrap;
}
.role{
  display:inline-block;
  background:#eff6ff;
  color:#2563eb;
  padding:8px 15px;
  border-radius:20px;
  font-size:13px;
  margin-top:10px;
}
.message{
  text-align:center;
  color:#64748b;
  padding:30px 10px;
}
.back{
  color:white;
  text-decoration:none;
  font-size:14px;
}
footer{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">CAMPUS ONE</div>
  <a class="back" href="index.html">العودة للرئيسية</a>
</header>

<main>
  <div id="loading" class="message">جارٍ تحميل الملف الشخصي...</div>

  <section id="profile" class="card" hidden>
    <img id="avatar" class="avatar" alt="صورة المدير">

    <div class="name-row">
      <h2 id="name"></h2>
      <span class="verified" title="حساب موثق">✓</span>
    </div>

    <div class="role">إدارة CAMPUS ONE</div>

    <p id="bio" class="bio"></p>
  </section>

  <div id="error" class="message" hidden>
    تعذر تحميل الملف الشخصي حالياً.
  </div>
</main>

<footer>
  CAMPUS ONE © 2026
  <br>
  كل ما يحتاجه الطالب، في مكان واحد.
</footer>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://rpvoajlzkoynimfowzgl.supabase.co',
  'sb_publishable_4KCDnpiH2lCjKhKj4s8dmA_Wv71o552'
);

const loading = document.getElementById('loading');
const profile = document.getElementById('profile');
const error = document.getElementById('error');

async function loadProfile(){
  try {
    const { data, error: rpcError } = await supabase
      .rpc('get_public_admin_profile');

    if(rpcError) throw rpcError;

    if(!data || data.length === 0){
      throw new Error('No admin profile');
    }

    const admin = data[0];

    document.getElementById('name').textContent =
      admin.full_name || 'مدير CAMPUS ONE';

    document.getElementById('bio').textContent =
      admin.bio || 'مرحباً بكم في CAMPUS ONE.';

    const avatar = document.getElementById('avatar');

    if(admin.avatar_url){
      const { data: imageData, error: imageError } =
        await supabase.storage
          .from('admin-avatars')
          .createSignedUrl(admin.avatar_url, 3600);

      if(!imageError && imageData?.signedUrl){
        avatar.src = imageData.signedUrl;
      } else {
        avatar.src = 'https://placehold.co/125x125/e2e8f0/102b50?text=ADMIN';
      }
    } else {
      avatar.src = 'https://placehold.co/125x125/e2e8f0/102b50?text=ADMIN';
    }

    loading.hidden = true;
    profile.hidden = false;

  } catch(err) {
    console.error(err);
    loading.hidden = true;
    error.hidden = false;
  }
}

loadProfile();
</script>

</body>
</html>
