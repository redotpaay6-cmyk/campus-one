
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1930">
<title>CAMPUS ONE | البحث عن الطلاب</title>

<style>
*{box-sizing:border-box}
:root{
 --navy:#102b46;
 --blue:#2563eb;
 --light:#eff6ff;
 --bg:#f1f5f9;
 --text:#102b46;
 --muted:#64748b;
 --border:#e7edf5;
}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 padding-bottom:100px;
}
header{
 background:#0b1930;
 color:white;
 padding:20px 16px;
}
.header-inner{
 max-width:850px;
 margin:auto;
}
header h2{margin:0 0 7px;font-size:22px}
header p{margin:0;color:#cbd5e1;font-size:13px}
.container{
 max-width:850px;
 margin:25px auto;
 padding:0 15px;
}
.search-box{
 background:white;
 padding:18px;
 border-radius:16px;
 box-shadow:0 3px 15px #102b4610;
}
.search-box label{
 display:block;
 font-weight:bold;
 margin-bottom:12px;
}
.search-input{
 width:100%;
 padding:15px;
 border:1px solid #dbe3ee;
 border-radius:12px;
 outline:none;
 font-size:16px;
 direction:ltr;
 text-align:left;
}
.search-input:focus{border-color:#2563eb}
.hint{
 color:#64748b;
 font-size:12px;
 margin-top:10px;
}
.status{
 text-align:center;
 padding:25px 10px;
 color:#64748b;
 font-size:14px;
}
.results-title{
 margin:24px 3px 12px;
 font-size:16px;
 font-weight:bold;
}
.student-card{
 background:white;
 padding:14px;
 border-radius:14px;
 display:flex;
 align-items:center;
 gap:13px;
 margin-bottom:10px;
 box-shadow:0 2px 10px #102b4608;
}
.avatar{
 width:52px;
 height:52px;
 border-radius:50%;
 background:#e2e8f0;
 object-fit:cover;
 flex-shrink:0;
}
.student-info{flex:1;min-width:0}
.student-name{
 font-weight:bold;
 margin-bottom:6px;
}
.username{
 color:#64748b;
 font-size:13px;
 direction:ltr;
 text-align:right;
}
.verified{
 color:#2563eb;
 font-size:13px;
 margin-right:4px;
}
.open-profile{
 border:0;
 background:#2563eb;
 color:white;
 padding:10px 13px;
 border-radius:9px;
 font-weight:bold;
 cursor:pointer;
}
.back{
 display:inline-block;
 margin-top:18px;
 color:#2563eb;
 text-decoration:none;
 font-size:14px;
}

/* شريط التنقل الموحد */
.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#ffffffed;
 backdrop-filter:blur(18px);
 border-top:1px solid #e5eaf1;
 display:flex;
 justify-content:space-around;
 align-items:center;
 padding:9px 3px calc(9px + env(safe-area-inset-bottom));
 z-index:100;
 box-shadow:0 -5px 25px #102b4608;
}
.nav-item{
 position:relative;
 color:#8995a7;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:4px;
 font-size:10px;
 font-weight:600;
 text-decoration:none;
 flex:1;
 min-width:0;
 padding:6px 1px;
 border-radius:13px;
}
.nav-icon{
 width:25px;
 height:25px;
 display:grid;
 place-items:center;
}
.nav-icon svg{
 width:23px;
 height:23px;
 stroke:currentColor;
 fill:none;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
}
.nav-item.active{
 color:var(--blue);
 background:#eff6ff;
}
.nav-item.active .nav-icon svg{
 stroke-width:2.4;
}
.nav-label{white-space:nowrap}

@media(min-width:701px){
 .bottom-nav{
  max-width:650px;
  left:50%;
  right:auto;
  transform:translateX(-50%);
  bottom:12px;
  width:calc(100% - 30px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:9px;
  box-shadow:0 8px 35px #102b4620;
 }
}
</style>
</head>

<body>

<header>
 <div class="header-inner">
  <h2>🔎 البحث عن الطلاب</h2>
  <p>CAMPUS ONE — اكتشف زملاءك في الجامعة</p>
 </div>
</header>

<main class="container">

 <section class="search-box">
  <label for="searchInput">ابحث باسم المستخدم</label>
  <input
   id="searchInput"
   class="search-input"
   type="text"
   placeholder="مثال: mouhamed_25"
   autocomplete="off"
   maxlength="20"
  >
  <div class="hint">اكتب حرفين على الأقل للبحث عن حساب.</div>
 </section>

 <div class="results-title">نتائج البحث</div>
 <div id="results" class="status">
  اكتب اسم المستخدم للعثور على الطلاب.
 </div>

 <a class="back" href="dashboard.html">← العودة إلى الرئيسية</a>

</main>

<nav class="bottom-nav" aria-label="التنقل الرئيسي">
 <a class="nav-item" href="dashboard.html">
  <span class="nav-icon">
   <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></svg>
  </span>
  <span class="nav-label">الرئيسية</span>
 </a>

 <a class="nav-item" href="community.html">
  <span class="nav-icon">
   <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  </span>
  <span class="nav-label">المجتمع</span>
 </a>

 <a class="nav-item active" href="search.html">
  <span class="nav-icon">
   <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  </span>
  <span class="nav-label">البحث</span>
 </a>

 <a class="nav-item" href="messages.html">
  <span class="nav-icon">
   <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3H13a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
  </span>
  <span class="nav-label">الرسائل</span>
 </a>

 <a class="nav-item" href="notifications.html">
  <span class="nav-icon">
   <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
  </span>
  <span class="nav-label">الإشعارات</span>
 </a>

 <a class="nav-item" href="student.html">
  <span class="nav-icon">
   <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
  </span>
  <span class="nav-label">حسابي</span>
 </a>
</nav>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://rpvoajlzkoynimfowzgl.supabase.co';

const SUPABASE_KEY =
'sb_publishable_4KCDnpiH2lCjKhKj4s8dmA_Wv71o552';

const supabase = createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const input = document.getElementById('searchInput');
const results = document.getElementById('results');

let timer = null;
let requestNumber = 0;

function showMessage(message){
 results.className = 'status';
 results.textContent = message;
}

function escapeHTML(value){
 return String(value ?? '').replace(/[&<>"']/g, char => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 })[char]);
}

async function searchStudents(term){
 const currentRequest = ++requestNumber;

 if(term.length < 2){
  showMessage('اكتب حرفين على الأقل للبحث.');
  return;
 }

 showMessage('جاري البحث...');

 const {data,error} = await supabase.rpc(
  'search_students',
  {search_term:term}
 );

 if(currentRequest !== requestNumber) return;

 if(error){
  console.error(error);
  showMessage('حدث خطأ أثناء البحث. حاول مرة أخرى.');
  return;
 }

 if(!data || data.length === 0){
  showMessage('لم نعثر على حساب بهذا الاسم.');
  return;
 }

 results.className = '';
 results.replaceChildren();

 for(const student of data){
  const card = document.createElement('article');
  card.className = 'student-card';

  const avatar = document.createElement('img');
  avatar.className = 'avatar';
  avatar.alt = 'الصورة الشخصية';
  avatar.src = 'https://placehold.co/100x100/e2e8f0/64748b?text=User';

  if(student.profile_avatar_path){
   const {data: signedData} =
    await supabase.storage
     .from('community-media')
     .createSignedUrl(student.profile_avatar_path,3600);

   if(signedData?.signedUrl){
    avatar.src = signedData.signedUrl;
   }
  }

  const info = document.createElement('div');
  info.className = 'student-info';

  const name = document.createElement('div');
  name.className = 'student-name';
  name.textContent = student.full_name || 'طالب';

  if(student.verification_status === 'approved'){
   const verified = document.createElement('span');
   verified.className = 'verified';
   verified.textContent = '✓';
   verified.title = 'حساب موثّق';
   name.appendChild(verified);
  }

  const username = document.createElement('div');
  username.className = 'username';
  username.textContent = '@' + student.username;

  info.append(name,username);

  const button = document.createElement('button');
  button.className = 'open-profile';
  button.textContent = 'عرض';

  button.addEventListener('click',()=>{
   window.location.href =
    'student.html?user=' +
    encodeURIComponent(student.id);
  });

  card.append(avatar,info,button);
  results.appendChild(card);
 }
}

input.addEventListener('input',()=>{
 clearTimeout(timer);
 const term = input.value.trim().replace(/^@/,'').toLowerCase();

 timer = setTimeout(()=>{
  searchStudents(term);
 },400);
});

async function checkSession(){
 const {data,error} = await supabase.auth.getSession();

 if(error || !data.session){
  window.location.href = 'auth.html';
 }
}

checkSession();
</script>

</body>
</html>
