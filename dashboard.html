
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b50">
<title>CAMPUS ONE | الرئيسية</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --navy:#102b50;
 --blue:#2563eb;
 --light-blue:#eff6ff;
 --bg:#f4f7fb;
 --text:#172b46;
 --muted:#8490a2;
 --border:#e9eef5;
 --red:#ef4444;
}

body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 padding-bottom:85px;
}

button,input{font:inherit}
button{cursor:pointer}

header{
 background:#fff;
 color:var(--navy);
 padding:14px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:20;
 border-bottom:1px solid var(--border);
}

.logo{font-size:20px;font-weight:900}
.header-actions{display:flex;gap:10px;align-items:center}

.icon-button{
 width:40px;height:40px;
 display:grid;place-items:center;
 background:#f1f5f9;
 border:0;color:var(--navy);
 border-radius:12px;
 position:relative;
}

.icon-button svg{
 width:24px;height:24px;
 fill:none;stroke:currentColor;
 stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.badge-count{
 position:absolute;top:-5px;right:-5px;
 background:var(--red);color:white;
 border-radius:20px;min-width:18px;height:18px;
 padding:0 4px;font-size:10px;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold;border:2px solid white;
}
.badge-count.hidden{display:none}

.container{max-width:1050px;margin:auto;padding:22px 16px}

.welcome{
 background:linear-gradient(135deg,#102b50,#1768a5);
 color:white;padding:25px;border-radius:20px;
 margin-bottom:22px;
 box-shadow:0 8px 25px #102b4620;
}
.welcome h1{font-size:23px;margin-bottom:9px}
.welcome p{color:#dbeafe;font-size:14px;margin-top:6px}

.section-title{
 font-size:19px;margin:25px 0 14px;font-weight:800;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
}

.card{
 background:white;padding:19px 15px;
 border-radius:17px;border:1px solid var(--border);
 box-shadow:0 4px 15px #102b4608;
 cursor:pointer;transition:.2s;
 text-align:right;color:inherit;
 text-decoration:none;display:block;
}
.card:active{transform:scale(.97)}

.card-icon{
 width:46px;height:46px;
 border-radius:14px;background:var(--light-blue);
 color:var(--blue);
 display:flex;align-items:center;justify-content:center;
 margin-bottom:13px;
}
.card-icon svg{
 width:24px;height:24px;
 fill:none;stroke:currentColor;
 stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.card h3{font-size:15px;margin-bottom:7px}
.card p{font-size:12px;color:var(--muted);line-height:1.7}

.notice{
 background:white;border:1px solid var(--border);
 padding:18px;border-radius:17px;margin-top:12px;
 box-shadow:0 4px 15px #102b4608;
}
.notice h3{
 font-size:15px;margin-bottom:9px;
 display:flex;align-items:center;gap:8px;
}
.notice h3 svg{
 width:21px;height:21px;flex-shrink:0;
 fill:none;stroke:currentColor;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round;
}
.notice p{font-size:13px;color:var(--muted);line-height:1.8}

.admin-link{
 display:inline-block;margin-top:12px;
 color:var(--blue);text-decoration:none;font-weight:bold;
}

.logout{
 background:#fff0f0;color:#c53030;border:0;
 padding:11px 16px;border-radius:10px;
 margin-top:22px;font-weight:bold;
}

.loading{text-align:center;padding:35px 15px;color:var(--muted)}

/* POSTS FEED */

.feed-section{margin-top:28px}

.feed-header{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin-bottom:14px;
}
.feed-header .section-title{margin:0}

.refresh-feed{
 border:1px solid var(--border);background:white;
 color:var(--blue);padding:8px 12px;
 border-radius:10px;font-weight:bold;
}

.post-card{
 background:white;border:1px solid var(--border);
 border-radius:17px;padding:16px;margin-bottom:13px;
 box-shadow:0 4px 15px #102b4608;
}

.post-top{
 display:flex;align-items:center;gap:10px;margin-bottom:13px;
}

.post-avatar{
 width:43px;height:43px;border-radius:50%;
 background:#eff6ff;color:var(--blue);
 display:grid;place-items:center;font-weight:bold;
 flex-shrink:0;overflow:hidden;
}
.post-avatar img{width:100%;height:100%;object-fit:cover}

.post-author{
 font-size:14px;font-weight:800;
 color:var(--text);text-decoration:none;
}
.post-author:hover{color:var(--blue)}

.post-date{font-size:11px;color:var(--muted);margin-top:5px}

.post-space{
 display:inline-flex;align-items:center;gap:5px;
 margin-top:7px;padding:6px 10px;border-radius:8px;
 background:#eff6ff;color:#2563eb;
 font-size:11px;font-weight:bold;text-decoration:none;
}
.post-space:hover{background:#dbeafe}
.post-space svg{
 width:15px;height:15px;fill:none;stroke:currentColor;
 stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.post-content{
 font-size:14px;line-height:1.9;
 white-space:pre-wrap;overflow-wrap:anywhere;
 margin:10px 0;
}

.post-image{
 width:100%;max-height:420px;
 object-fit:cover;border-radius:13px;margin-top:8px;
}

.post-footer{
 display:flex;align-items:center;justify-content:space-between;
 gap:5px;border-top:1px solid var(--border);
 padding-top:12px;margin-top:12px;flex-wrap:wrap;
}

.post-action{
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 gap:5px;border:0;background:transparent;
 color:#64748b;padding:7px 4px;border-radius:9px;
 font-size:11px;cursor:pointer;transition:.2s;
 flex:1;min-width:0;
}

.post-action:active{transform:scale(.92)}

.post-action .action-icon{
 width:22px;height:22px;
 display:grid;place-items:center;
}
.post-action .action-icon svg{
 width:22px;height:22px;
 fill:none;stroke:currentColor;
 stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.post-action .action-count{font-size:10px}
.post-action.active{color:var(--blue);background:#eff6ff}
.post-action.liked{color:var(--red);background:#fff1f2}
.post-action:disabled{opacity:.5;cursor:wait}

.comments-area{
 display:none;margin-top:13px;padding-top:13px;
 border-top:1px solid var(--border);
}
.comments-area.open{display:block}

.comments-list{
 display:flex;flex-direction:column;
 gap:10px;margin-bottom:12px;
}
.comment-item{
 display:flex;gap:9px;align-items:flex-start;
 background:#f8fafc;padding:10px;border-radius:12px;
}
.comment-avatar{
 width:30px;height:30px;border-radius:50%;
 background:#dbeafe;color:#2563eb;
 display:grid;place-items:center;font-size:12px;
 font-weight:bold;flex-shrink:0;overflow:hidden;
}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-body{min-width:0;flex:1}
.comment-name{font-size:12px;font-weight:bold;margin-bottom:4px}
.comment-text{
 font-size:13px;line-height:1.7;
 overflow-wrap:anywhere;white-space:pre-wrap;
}
.comment-date{font-size:10px;color:var(--muted);margin-top:5px}

.comment-form{display:flex;gap:8px;align-items:center}
.comment-input{
 flex:1;min-width:0;border:1px solid var(--border);
 background:#f8fafc;border-radius:12px;
 padding:11px 12px;font-family:inherit;
 font-size:13px;outline:none;
}
.comment-input:focus{border-color:var(--blue);background:white}
.comment-submit{
 border:0;background:var(--blue);color:white;
 padding:11px 14px;border-radius:11px;
 font-weight:bold;font-size:12px;
}
.comment-submit:disabled{opacity:.5}

.comments-empty{
 text-align:center;color:var(--muted);
 font-size:12px;padding:12px;
}

.empty-feed{
 background:white;border:1px dashed #cbd5e1;
 border-radius:16px;padding:28px 16px;
 text-align:center;color:var(--muted);
 font-size:13px;line-height:1.9;
}

.feed-error{
 background:#fff7ed;border:1px solid #fed7aa;
 border-radius:13px;padding:15px;
 color:#9a3412;font-size:13px;line-height:1.8;
}

/* UNIFIED BOTTOM NAVIGATION */

.bottom-nav{
 display:flex;justify-content:space-around;
 position:fixed;bottom:0;left:0;right:0;
 background:#fff;border-top:1px solid var(--border);
 padding:8px 3px calc(8px + env(safe-area-inset-bottom));
 z-index:100;
}

.nav-item{
 text-decoration:none;color:#7b8797;
 font-size:10px;text-align:center;line-height:1.5;
 flex:1;min-width:0;
 display:flex;flex-direction:column;
 align-items:center;gap:3px;
 padding:3px 1px;
 border-radius:10px;
 transition:color .2s,background .2s;
 -webkit-tap-highlight-color:transparent;
}

.nav-icon{
 width:24px;height:24px;
 display:grid;place-items:center;
}

.nav-icon svg{
 width:24px;height:24px;
 fill:none;stroke:currentColor;
 stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.nav-item.active{
 color:var(--blue);font-weight:bold;
}
.nav-item:active{background:#eff6ff}
.nav-label{white-space:nowrap}

.nav-badge{
 position:absolute;
 top:0;right:calc(50% - 19px);
 min-width:16px;height:16px;padding:0 4px;
 background:#ef4444;color:white;
 border:2px solid white;border-radius:20px;
 font-size:9px;display:flex;
 align-items:center;justify-content:center;font-weight:bold;
}
.nav-badge.hidden{display:none}

@media(min-width:700px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .welcome{padding:35px}
 .welcome h1{font-size:28px}
 .bottom-nav{
  max-width:650px;left:50%;right:auto;
  transform:translateX(-50%);
  bottom:12px;width:calc(100% - 30px);
  border:1px solid var(--border);
  border-radius:16px;padding:8px;
  box-shadow:0 8px 30px #102b4615;
 }
 body{padding-bottom:100px}
}
</style>
</head>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
 'https://rpvoajlzkoynimfowzgl.supabase.co',
 'sb_publishable_4KCDnpiH2lCjKhKj4s8dmA_Wv71o552'
);

const main = document.getElementById('mainContent');
const notificationCount = document.getElementById('notificationCount');
const navNotificationCount = document.getElementById('navNotificationCount');

let currentUserId = null;
let notificationChannel = null;
let publicProfiles = new Map();
let postsCache = new Map();

const iconPaths = {
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 posts:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
 bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
 community:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1.5a6.5 6.5 0 0 1 13 0V20z"/><path d="M16 5a3.5 3.5 0 0 1 0 7"/>',
 message:'<path d="M4 5h16v12H9l-5 4z"/>',
 heart:'<path d="M20.8 8.8c0 5.5-8.8 11-8.8 11s-8.8-5.5-8.8-11A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6z"/>',
 comment:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3H13a8.5 8.5 0 0 1 8 8v.5z"/>',
 repost:'<path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 share:'<path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4z"/>',
 bookmark:'<path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/>'
};

function svgIcon(name,size=22){
 return `<svg xmlns="http://www.w3.org/2000/svg"
  width="${size}" height="${size}" viewBox="0 0 24 24"
  fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true">${iconPaths[name]||''}</svg>`;
}

function escapeHTML(value){
 return String(value ?? '').replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[char]));
}

function getSavedPosts(){
 try{
  const saved=JSON.parse(localStorage.getItem('campus_saved_posts')||'[]');
  return Array.isArray(saved)?saved.map(String):[];
 }catch(error){
  return [];
 }
}

function setSavedPosts(posts){
 localStorage.setItem('campus_saved_posts',JSON.stringify(posts));
}

async function updateNotificationCount(){
 if(!currentUserId)return;

 const {count,error}=await supabase
  .from('notifications')
  .select('id',{count:'exact',head:true})
  .eq('recipient_id',currentUserId)
  .eq('is_read',false);

 if(error){
  console.error('Notification count error:',error);
  return;
 }

 const total=count||0;
 const label=total>99?'99+':total;

 if(total>0){
  notificationCount.textContent=label;
  notificationCount.classList.remove('hidden');
  navNotificationCount.textContent=label;
  navNotificationCount.classList.remove('hidden');
 }else{
  notificationCount.classList.add('hidden');
  navNotificationCount.classList.add('hidden');
 }
}

function subscribeToNotifications(){
 if(notificationChannel){
  supabase.removeChannel(notificationChannel);
 }

 notificationChannel=supabase
  .channel('dashboard-notifications-'+currentUserId)
  .on('postgres_changes',{
   event:'INSERT',
   schema:'public',
   table:'notifications',
   filter:'recipient_id=eq.'+currentUserId
  },()=>{
   updateNotificationCount();
  })
  .subscribe();
}

async function loadPosts(){
 const feed=document.getElementById('postsFeed');
 if(!feed)return;

 feed.innerHTML='<div class="loading">جارٍ تحميل المنشورات...</div>';

 try{
  const {data:posts,error}=await supabase
   .from('posts')
   .select('id,author_id,content,image_path,created_at,space_id')
   .order('created_at',{ascending:false})
   .limit(30);

  if(error)throw error;

  if(!posts||posts.length===0){
   feed.innerHTML=`
    <div class="empty-feed">
     لا توجد منشورات حتى الآن.<br>
     ستظهر هنا منشورات الطلبة من جميع المساحات.
    </div>`;
   return;
  }

  const postIds=posts.map(p=>p.id);

  const {data:profiles,error:profilesError}=
   await supabase.rpc('get_public_profiles');

  if(profilesError)console.error('Profiles:',profilesError);

  publicProfiles=new Map((profiles||[]).map(p=>[p.id,p]));

  const spaceIds=[...new Set(posts.map(p=>p.space_id).filter(Boolean))];
  let spaceMap=new Map();

  if(spaceIds.length){
   const {data:spaces,error:spacesError}=await supabase
    .from('community_spaces')
    .select('id,name')
    .in('id',spaceIds);

   if(spacesError)console.error('Spaces:',spacesError);
   spaceMap=new Map((spaces||[]).map(s=>[s.id,s.name]));
  }

  const [likesResult,commentsResult,repostsResult]=await Promise.all([
   supabase.from('post_likes').select('post_id,user_id').in('post_id',postIds),
   supabase.from('comments').select('post_id').in('post_id',postIds),
   supabase.from('reposts').select('post_id,author_id').in('post_id',postIds)
  ]);

  if(likesResult.error)console.error('Likes:',likesResult.error);
  if(commentsResult.error)console.error('Comments:',commentsResult.error);
  if(repostsResult.error)console.error('Reposts:',repostsResult.error);

  const likes=likesResult.data||[];
  const comments=commentsResult.data||[];
  const reposts=repostsResult.data||[];

  const likeCounts=new Map();
  const commentCounts=new Map();
  const repostCounts=new Map();
  const myLikes=new Set();
  const myReposts=new Set();

  likes.forEach(item=>{
   likeCounts.set(item.post_id,(likeCounts.get(item.post_id)||0)+1);
   if(item.user_id===currentUserId)myLikes.add(item.post_id);
  });

  comments.forEach(item=>{
   commentCounts.set(item.post_id,(commentCounts.get(item.post_id)||0)+1);
  });

  reposts.forEach(item=>{
   repostCounts.set(item.post_id,(repostCounts.get(item.post_id)||0)+1);
   if(item.author_id===currentUserId)myReposts.add(item.post_id);
  });

  postsCache=new Map(posts.map(post=>[post.id,post]));

  const savedPosts=getSavedPosts();

  const cards=await Promise.all(posts.map(async post=>{
   const profile=publicProfiles.get(post.author_id);
   const authorName=profile?.full_name||'طالب CAMPUS ONE';
   const avatarPath=profile?.profile_avatar_path||'';

   const spaceName=post.space_id
    ?(spaceMap.get(post.space_id)||'مساحة جامعية')
    :null;

   let avatarHTML=escapeHTML(authorName.trim().charAt(0)||'ط');

   if(avatarPath){
    const {data:avatarData,error:avatarError}=await supabase
     .storage.from('community-media')
     .createSignedUrl(avatarPath,3600);

    if(!avatarError&&avatarData?.signedUrl){
     avatarHTML=`<img src="${escapeHTML(avatarData.signedUrl)}" alt="">`;
    }
   }

   let imageHTML='';

   if(post.image_path){
    const {data:imageData,error:imageError}=await supabase
     .storage.from('community-media')
     .createSignedUrl(post.image_path,3600);

    if(!imageError&&imageData?.signedUrl){
     imageHTML=`
      <img class="post-image"
       src="${escapeHTML(imageData.signedUrl)}"
       alt="صورة المنشور" loading="lazy">`;
    }
   }

   const date=post.created_at
    ?new Date(post.created_at).toLocaleString('ar-DZ',{
      dateStyle:'medium',timeStyle:'short'
     })
    :'';

   const liked=myLikes.has(post.id);
   const reposted=myReposts.has(post.id);
   const saved=savedPosts.includes(String(post.id));

   return `
    <article class="post-card" data-post-id="${escapeHTML(post.id)}">

     <div class="post-top">
